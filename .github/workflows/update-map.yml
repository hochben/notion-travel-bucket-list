name: Update travel map data

on:
  # Regular refresh so database changes reach the map on their own.
  schedule:
    - cron: "*/5 * * * *"
  # Manual button in the Actions tab, and what an automation calls.
  workflow_dispatch:
  # Rebuild whenever the pipeline itself changes.
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "codes.json"
      - ".github/workflows/update-map.yml"

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the Notion database
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID || '33091aa3-d311-82f1-83d7-819ce05ac68e' }}
        run: python scripts/build_data.py

      - name: Commit only if the data actually changed
        run: |
          if git diff --quiet -- data.json; then
            echo "No change - map is already current."
          else
            git config user.name "travel-map bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update map data from Notion"
            git push
          fi
