function topoGeo(t){if(!t||t.type!=='Topology')return t;var o=t.objects.countries||t.objects[Object.keys(t.objects)[0]];if(window.topojson&&topojson.feature){var fc=topojson.feature(t,o);fc.features=fc.features.filter(function(f){return f.geometry});return fc}var s=t.transform?t.transform.scale:[1,1],tr=t.transform?t.transform.translate:[0,0],a=t.arcs.map(function(q){var x=0,y=0;return q.map(function(p){if(t.transform){x+=p[0];y+=p[1];return[x*s[0]+tr[0],y*s[1]+tr[1]]}return[p[0],p[1]]})});function arc(i){return i>=0?a[i]:a[~i].slice().reverse()}function ring(ids){var r=[];ids.forEach(function(i,n){var q=arc(i);r=r.concat(n?q.slice(1):q)});if(r.length&&(r[0][0]!==r[r.length-1][0]||r[0][1]!==r[r.length-1][1]))r.push(r[0].slice());return r}function geom(g){if(!g||!g.arcs)return null;if(g.type==='Polygon')return{type:'Polygon',coordinates:g.arcs.map(ring)};if(g.type==='MultiPolygon')return{type:'MultiPolygon',coordinates:g.arcs.map(function(p){return p.map(ring)})};return null}return{type:'FeatureCollection',features:o.geometries.map(function(g){return{type:'Feature',id:g.id,properties:g.properties||{},geometry:geom(g)}}).filter(function(f){return f.geometry})}}
